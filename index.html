<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Портфолио | Vigbo Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        header p {
            color: #a0a0a0;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        .upload-section {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }
        .upload-btn {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 12px 30px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-btn:hover {
            background-color: #ffffff;
            color: #121212;
        }
        #file-input {
            display: none;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            background-color: #1a1a1a;
            aspect-ratio: 3 / 2;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <header>
        <h1>Фотограф Портфолио</h1>
        <p>Галерея вдохновения в стиле Vigbo</p>
    </header>

    <div class="upload-section">
        <label for="file-input" class="upload-btn">Добавить фото</label>
        <input type="file" id="file-input" accept="image/*" multiple>
    </div>

    <main class="gallery" id="gallery">
        <!-- Сюда будут добавляться фотографии -->
        <div class="gallery-item"><img src="https://unsplash.com" alt="Sample"></div>
        <div class="gallery-item"><img src="https://unsplash.com" alt="Sample"></div>
        <div class="gallery-item"><img src="https://unsplash.com" alt="Sample"></div>
    </main>

    <script>
        const fileInput = document.getElementById('file-input');
        const gallery = document.getElementById('gallery');

        fileInput.addEventListener('change', function(event) {
            const files = event.target.files;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file) {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        const item = document.createElement('div');
                        item.classList.add('gallery-item');
                        
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.alt = 'Загруженное фото';
                        
                        item.appendChild(img);
                        // Добавляем новые фотографии в начало галереи
                        gallery.insertBefore(item, gallery.firstChild);
                    }
                    
                    reader.readAsDataURL(file);
                }
            }
        });
    </script>
</body>
</html>
